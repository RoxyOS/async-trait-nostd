[package]
name = "async-trait-nostd"
version = "0.1.90"
categories = ["asynchronous", "no-std"]
description = "Async-trait with no_std support"
edition = "2021"
exclude = ["build.rs"]
keywords = ["async", "no_std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RoxyOS/async-trait-nostd"
rust-version = "1.71"

[lib]
name = "async_trait"
proc-macro = true

[dependencies]
proc-macro2 = "1.0.74"
quote = "1.0.35"
syn = { version = "2.0.46", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "visit-mut"] }

[dev-dependencies]
rustversion = "1.0.13"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
    "--extern-html-root-url=proc_macro=https://doc.rust-lang.org",
]
